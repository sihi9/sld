name: unet
features: [16, 32]
fc_bottleneck: false
fc_recurrent: false  # only useful when fc_bottleneck is true
hidden_dim: 512     # only useful when fc_bottleneck is true
output_timesteps: 1
use_plif_encoder: true
use_plif_recurrent: true
use_plif_decoder: true
init_tau_recurrent: 20.0
init_tau_encoder: 2.0
init_tau_decoder: 2.0
