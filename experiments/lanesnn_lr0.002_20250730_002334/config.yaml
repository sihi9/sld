data:
  batch_size: 8
  downscale: 4
  label_smoothing:
    background: 0.05
    enabled: false
    lane: 0.95
  loader: det
  num_workers: 4
  use_poisson: false
  use_static: false
  used_T: 30
defaults:
  data: det
  model: unet
description: LaneSNN with 200 Epochs
log:
  vis_interval: 20
model:
  conv_recurrent: false
  hidden_dim: 600
  init_tau: 1.25
  initial_scaling: 1
  name: lanesnn
  use_plif: false
train:
  amp: false
  device: auto
  epochs: 200
  lr: 0.002
  save_intermediate: false
