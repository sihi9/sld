data:
  batch_size: 16
  downscale: 4
  label_smoothing:
    background: 0.05
    enabled: false
    lane: 0.95
  loader: det
  num_workers: 4
  use_poisson: false
  use_static: false
  used_T: 30
defaults:
  data: det
  model: unet
description: deep unet fulyl recurrent
log:
  vis_interval: 20
model:
  conv_recurrent: true
  fc_bottleneck: true
  fc_recurrent: true
  features:
  - 32
  - 64
  - 128
  - 256
  hidden_dim: 512
  init_tau_decoder: 1.5
  init_tau_encoder: 1.5
  init_tau_recurrent: 15.0
  initial_scaling: 1
  name: unet
  output_timesteps: 1
  use_plif_decoder: false
  use_plif_encoder: true
  use_plif_recurrent: false
train:
  amp: false
  device: auto
  epochs: 200
  lr: 0.002
  save_intermediate: false
