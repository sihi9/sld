name: unet
features: [16, 24, 32, 48]
fc_bottleneck: true
fc_recurrent: true  # only useful when fc_bottleneck is true
conv_recurrent: true  # use conv layers for recurrent connections
hidden_dim: 512     # only useful when fc_bottleneck is true
output_timesteps: 1
soft_reset: false  # use soft reset for neurons
skip_connections: true 
analog: true  # use analog skips. Note that this will not work without initial scaling block, as initial neurons would not spike
initial_scaling: 1  # initial scaling factor for input size, used to calculate downscaling factor
use_plif_encoder: true
use_plif_recurrent: true
use_plif_decoder: true
init_tau_recurrent: 15.0
init_tau_encoder: 1.5
init_tau_decoder: 1.5
