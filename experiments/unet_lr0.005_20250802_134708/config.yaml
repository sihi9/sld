data:
  batch_size: 8
  downscale: 4
  label_smoothing:
    background: 0.05
    enabled: true
    lane: 0.95
  loader: det
  num_workers: 4
  use_poisson: false
  use_static: false
  used_T: 30
defaults:
  data: det
  model: unet
description: deep small non-recurrent unet with small tau
log:
  vis_interval: 20
model:
  conv_recurrent: false
  fc_bottleneck: true
  fc_recurrent: false
  features:
  - 8
  - 16
  - 32
  - 48
  hidden_dim: 512
  init_tau_decoder: 1.5
  init_tau_encoder: 1.5
  init_tau_recurrent: 10.0
  initial_scaling: 1
  name: unet
  output_timesteps: 1
  use_plif_decoder: false
  use_plif_encoder: true
  use_plif_recurrent: false
train:
  amp: false
  device: auto
  epochs: 200
  lr: 0.005
  save_intermediate: false
